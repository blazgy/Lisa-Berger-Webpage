<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ihr Termin | Praxis Lisa Berger</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="stylesheet" href="styles.css?v=1.4">
    <link rel="stylesheet" href="booking.css?v=1">
</head>

<body class="bg-off-white text-dark-text">
    <div class="page_wrap">
        <header class="u-container u-flex" data-align="center" style="padding-block: 2rem;">
            <a href="/" aria-label="Zur Startseite">
                <img src="berger-logo.svg" alt="Lisa Berger" style="height: 40px; width: auto;">
            </a>
        </header>

        <main class="u-container u-padding-block-3">
            <div class="manage-card glass-panel shadow-sm" style="border-top: 3px solid var(--swatch--sage);">
                <h1 class="u-text-style-h3 u-weight-medium text-dark-text mb-4">Ihr Termin</h1>
                <div id="manage-loading" class="u-text-style-small text-gray-600">Termin wird geladen …</div>
                <div id="manage-error" class="booking-error hidden" role="alert"></div>

                <div id="manage-content" class="hidden">
                    <div id="manage-details" class="booking-details-box mb-6"></div>
                    <p id="manage-status" class="u-text-style-small text-gray-700 leading-relaxed mb-6"></p>
                    <div id="manage-actions" class="u-flex gap-md" data-direction="vertical"></div>
                </div>

                <p class="u-text-style-small text-gray-500 leading-relaxed" style="margin-top: 2rem;">
                    Fragen? <a href="mailto:info@psychotherapieberger.at" class="underline text-dark-text">info@psychotherapieberger.at</a>
                    · <a href="tel:+4367763142687" class="underline text-dark-text">+43 677 631 426 87</a>
                </p>
            </div>
        </main>
    </div>

    <script>
        (function () {
            "use strict";
            var token = (location.hash.match(/[#&]t=([A-Za-z0-9_-]+)/) || [])[1];
            var $ = function (id) { return document.getElementById(id); };
            var fmt = new Intl.DateTimeFormat("de-AT", {
                timeZone: "Europe/Vienna", weekday: "long", day: "numeric", month: "long",
                year: "numeric", hour: "2-digit", minute: "2-digit"
            });
            function when(iso) { return fmt.format(new Date(iso)) + " Uhr"; }

            function line(parent, strong, text) {
                if (strong) { var s = document.createElement("strong"); s.textContent = strong; parent.append(s, document.createElement("br")); }
                if (text) { parent.append(document.createTextNode(text), document.createElement("br")); }
            }

            function fail(message) {
                $("manage-loading").classList.add("hidden");
                $("manage-content").classList.add("hidden");
                $("manage-error").textContent = message;
                $("manage-error").classList.remove("hidden");
            }

            async function post(path) {
                var res = await fetch(path, {
                    method: "POST",
                    headers: { "content-type": "application/json" },
                    body: JSON.stringify({ token: token })
                });
                var data = await res.json().catch(function () { return {}; });
                if (!res.ok) throw new Error(data.error || "Es ist ein Fehler aufgetreten.");
                return data;
            }

            function render(b) {
                $("manage-loading").classList.add("hidden");
                $("manage-error").classList.add("hidden");
                $("manage-content").classList.remove("hidden");
                var details = $("manage-details");
                details.replaceChildren();
                line(details, b.service.name + " · " + b.sessionKind, null);
                line(details, null, when(b.start));
                line(details, null, b.service.durationMin + " Minuten · " + b.service.priceEur + " €");
                line(details, null, "Stadtplatz 36/25, 4840 Vöcklabruck (Galerie Burgstall, 3. Stock)");

                var status = $("manage-status");
                var actions = $("manage-actions");
                actions.replaceChildren();

                if (b.status === "cancelled") {
                    status.textContent = b.cancelledBy === "admin"
                        ? "Dieser Termin wurde von der Praxis abgesagt."
                        : "Dieser Termin wurde abgesagt. Sie erhalten eine Bestätigung per E-Mail.";
                    var again = document.createElement("a");
                    again.href = "/#kontakt";
                    again.className = "button-primary u-weight-medium";
                    again.style.cssText = "padding: 0.7rem 1.5rem; border-radius: 9999px; text-align: center;";
                    again.textContent = "Neuen Termin buchen";
                    actions.append(again);
                } else if (b.isPast) {
                    status.textContent = "Dieser Termin liegt in der Vergangenheit.";
                } else if (b.canCancel) {
                    status.textContent = "Sie können diesen Termin bis " + when(b.cancelDeadline) + " kostenfrei online absagen.";
                    var btn = document.createElement("button");
                    btn.type = "button";
                    btn.className = "button-primary u-weight-medium";
                    btn.style.cssText = "padding: 0.7rem 1.5rem; border-radius: 9999px; background: #fff; border: 1px solid #ef4444; color: #b91c1c;";
                    btn.textContent = "Termin kostenfrei absagen";
                    btn.addEventListener("click", async function () {
                        if (!confirm("Möchten Sie diesen Termin wirklich absagen?")) return;
                        btn.disabled = true;
                        btn.textContent = "Wird abgesagt …";
                        try {
                            render(await post("/api/manage/cancel"));
                        } catch (err) {
                            btn.disabled = false;
                            btn.textContent = "Termin kostenfrei absagen";
                            $("manage-error").textContent = err.message;
                            $("manage-error").classList.remove("hidden");
                        }
                    });
                    actions.append(btn);
                } else {
                    status.textContent = "Die Frist für eine kostenfreie Online-Absage ist abgelaufen (" + when(b.cancelDeadline) +
                        "). Bitte kontaktieren Sie mich telefonisch oder per E-Mail. Kurzfristige Absagen und versäumte Stunden werden in Rechnung gestellt.";
                }
            }

            if (!token) {
                fail("Dieser Link ist unvollständig. Bitte verwenden Sie den Link aus Ihrer Bestätigungs-E-Mail.");
                return;
            }
            // The token lives in the URL fragment, which browsers never send to servers or in referrers.
            post("/api/manage").then(render).catch(function (err) { fail(err.message); });
        })();
    </script>
</body>

</html>
